<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIT | User Authentication</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Welcome Section -->
        <div class="welcome-section">

            <h1>Welcome to AIT</h1>

            <p>Your journey towards innovation starts here.</p>

            <div class="welcome-icon">AIT</div>

        </div>


        <!-- Form Section -->
        <div class="form-section">

            <!-- Login Form -->
            <div id="loginForm">

                <h2>Sign In</h2>

                <p class="subtitle">Welcome back! Please login.</p>

                <form id="loginFormElement">

                    <label for="loginEmail">Email Address</label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <label for="loginPassword">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="loginPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <button type="submit">Login</button>

                </form>

                <p class="switch-text">

                    Don't have an account?

                    <a href="#" id="showRegister">Register</a>

                </p>

            </div>


            <!-- Registration Form -->
            <div id="registerForm" class="hidden">

                <h2>Create Account</h2>

                <p class="subtitle">Register to get started.</p>

                <form id="registerFormElement">

                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                    <label for="registerEmail">Email Address</label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                    <label for="registerPassword">Password</label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Minimum 8 characters"
                            minlength="8"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            data-target="registerPassword"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <button type="submit">Create Account</button>

                </form>

                <p class="switch-text">

                    Already have an account?

                    <a href="#" id="showLogin">Login</a>

                </p>

            </div>


            <!-- API Response Message -->
            <p id="message" role="status" aria-live="polite"></p>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
